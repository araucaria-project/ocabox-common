[tool.poetry]
name = "ocabox-common"
# When bumping the version, also update: ocabox-common_bases.py __version_num__
version = "1.6.0"
license = "MIT"
description = ""
authors = ["Ernest Lasek <elasek@akond.com>, Mikołaj Kałuszyński <mkalusz@camk.edu.pl>"]
readme = "README.md"
repository = "https://github.com/araucaria-project/ocabox-common"
keywords = ["ocabox-common"]
packages = [
    { include = "obcom" },
#    { include = "test" },  # do not install tests with the package
]

[tool.poetry.dependencies]
python = "^3.11"
pyzmq = "^27.0.2"
msgpack = ">=1.0.3,<1.1.0"
confuse = ">=1.7.0,<1.8.0"
datamodels = {git = "https://github.com/araucaria-project/datamodels.git"}


[tool.poetry.scripts]
tests = "test.run_tests:main"
optics-conformance = "obcom.optics.conformance:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
