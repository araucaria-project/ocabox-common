<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The optical path glyphs: one sprite for every renderer (obcom.optics.look). Box 80, centred
       on 0; strokes in currentColor, 1.6 at full size; no fills except dots. Drawn from the
       "Symbol sheet" board of the optical path design. -->
  <symbol id="sky" viewBox="-40 -40 80 80"><title>sky</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 -16 A17 17 0 1 0 6 16 A13 13 0 1 1 6 -16 Z"></path><circle cx="-16" cy="-15" r="1.4" fill="currentColor"></circle><circle cx="16" cy="-12" r="1.1" fill="currentColor"></circle><circle cx="14" cy="13" r="1.3" fill="currentColor"></circle></g></symbol>
  <symbol id="flat" viewBox="-40 -40 80 80"><title>flat screen</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="-15" y="-20" width="30" height="40" rx="2"></rect><path d="M-9 -10 H9 M-9 -3 H9 M-9 4 H9 M-9 11 H9" stroke-dasharray="2 3" opacity="0.7"></path></g></symbol>
  <symbol id="lamp" viewBox="-40 -40 80 80"><title>lamp</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-4" r="11"></circle><path d="M-5 -3 L-2 -9 L1 -1 L4 -7"></path><path d="M-5 9 H5 M-4 13 H4"></path><path d="M-19 -4 H-15 M15 -4 H19 M0 -23 V-19 M-13 -17 L-10 -14 M13 -17 L10 -14"></path></g></symbol>
  <symbol id="dump" viewBox="-40 -40 80 80"><title>beam dump</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M-18 -14 L14 0 L-18 14 Z"></path><path d="M-12 -9 L-12 9 M-6 -6.5 L-6 6.5 M0 -4 L0 4 M6 -1.5 L6 1.5" opacity="0.7"></path><path d="M18 -14 V14"></path></g></symbol>
  <symbol id="dome" viewBox="-40 -40 80 80"><title>dome</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M-24 12 A24 24 0 0 1 -4 -11.7"></path><path d="M4 -11.7 A24 24 0 0 1 24 12"></path><path d="M-28 12 H28"></path><path d="M-4 -11.7 V12 M4 -11.7 V12" opacity="0.45"></path></g></symbol>
  <symbol id="covers" viewBox="-40 -40 80 80"><title>mirror covers</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle r="15"></circle><path d="M10.6 -10.6 L17 -17 M-10.6 -10.6 L-17 -17 M10.6 10.6 L17 17 M-10.6 10.6 L-17 17"></path><path d="M17 -17 A8 8 0 0 1 22 -6 M-17 -17 A8 8 0 0 0 -22 -6 M17 17 A8 8 0 0 0 22 6 M-17 17 A8 8 0 0 1 -22 6"></path><circle r="3"></circle></g></symbol>
  <symbol id="m3" viewBox="-40 -40 80 80"><title>M3, a switch between output ports</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle r="18" opacity="0.5"></circle><path d="M-12 12 L12 -12" stroke-width="4"></path><path d="M-23 -12 A26 26 0 0 1 12 -23" opacity="0.8"></path><path d="M12 -23 L6 -25 M12 -23 L9 -18" opacity="0.8"></path><path d="M0 -31 V-26 M0 26 V31"></path></g></symbol>
  <symbol id="mirror" viewBox="-40 -40 80 80"><title>fan-in mirror (M4, M5)</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle r="17" stroke-dasharray="2 4" opacity="0.6"></circle><path d="M-10 10 L10 -10" stroke-width="3.5"></path><circle r="3"></circle></g></symbol>
  <symbol id="split" viewBox="-40 -40 80 80"><title>beam splitter, pick-off</title><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="-12" y="-12" width="24" height="24" rx="1.5"></rect><path d="M-12 12 L12 -12"></path></g></symbol>
  <symbol id="derot" viewBox="-40 -40 80 80"><title>derotator</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle r="9"></circle><path d="M-19 -7 A20 20 0 0 1 7 -19"></path><path d="M19 7 A20 20 0 0 1 -7 19"></path><path d="M7 -19 L1 -20.5 M7 -19 L5 -13.5"></path><path d="M-7 19 L-1 20.5 M-7 19 L-5 13.5"></path><circle r="1.6" fill="currentColor"></circle></g></symbol>
  <symbol id="fw" viewBox="-40 -40 80 80"><title>filter wheel</title><g fill="none" stroke="currentColor" stroke-width="1.6"><circle r="21"></circle><circle cx="0" cy="-13" r="5"></circle><circle cx="12.4" cy="-4" r="5"></circle><circle cx="7.6" cy="10.5" r="5"></circle><circle cx="-7.6" cy="10.5" r="5"></circle><circle cx="-12.4" cy="-4" r="5"></circle></g></symbol>
  <symbol id="fiber" viewBox="-40 -40 80 80"><title>fibre</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M-22 0 C-18 -12 -12 -12 -10 0 S-2 12 0 0 S8 -12 10 0 S18 12 22 0"></path><path d="M-26 -4 V4 M26 -4 V4"></path></g></symbol>
  <symbol id="camera" viewBox="-40 -40 80 80"><title>camera</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="-17" y="-15" width="34" height="30" rx="3"></rect><rect x="-9" y="-8" width="18" height="16"></rect><path d="M-3 -8 V8 M3 -8 V8 M-9 -2.7 H9 M-9 2.7 H9" opacity="0.5"></path><path d="M-6 -15 V-19 H6 V-15"></path></g></symbol>
  <symbol id="guider" viewBox="-40 -40 80 80"><title>guider camera</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="-14" y="-12" width="28" height="24" rx="3"></rect><circle r="6"></circle><path d="M0 -10 V-3 M0 3 V10 M-10 0 H-3 M3 0 H10"></path></g></symbol>
  <symbol id="spec" viewBox="-40 -40 80 80"><title>spectrograph</title><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M-16 14 L-2 -16 L12 14 Z"></path><path d="M8 4 L24 -6 M9 7 L25 2 M10 10 L24 12"></path></g></symbol>
  <symbol id="part" viewBox="-40 -40 80 80"><title>a component of a kind without a glyph</title><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="-14" y="-14" width="28" height="28" rx="6"></rect><circle r="2" fill="currentColor"></circle></g></symbol>
</svg>
